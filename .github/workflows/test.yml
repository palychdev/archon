name: test

on: [push]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile src/archon/*.py tools/*.py
      - run: $env:PYTHONPATH='src'; python -c "import tests.test_parse as t; t.test_clean_line(); t.test_found_line(); t.test_inner_archive(); print('ok')"
        shell: pwsh
